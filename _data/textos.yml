promocoes_aviso: "A Décima Arte participa de programas de afiliados (Amazon, Pichau, Terabyte). Isso significa que, se você comprar algo através de um dos links abaixo, podemos receber uma pequena comissão — sem custo extra pra você. Nós não vendemos nem enviamos nenhum produto: só selecionamos o que achamos que vale a pena."
promocoes_intro: "Aqui você encontra hardware, periféricos, jogos e cadeiras em promoção, além dos jogos grátis da semana na Steam e na Epic Games."
apoie_intro: "A Décima Arte é feita de forma independente. Se o conteúdo te ajuda ou te diverte, você pode apoiar com qualquer valor, via Pix."
sobre_texto: "A Décima Arte nasceu de uma ideia simples: jogos são a décima arte, e merecem ser tratados com a mesma curiosidade e profundidade que qualquer outra forma de expressão. Aqui você encontra notícias quentes do mundo dos games, curiosidades sobre como os jogos são feitos — engines, ferramentas, bastidores de produção — e, aos poucos, guias e conteúdo em vídeo pra quem também sonha em trabalhar com desenvolvimento de jogos."
