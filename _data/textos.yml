promocoes_aviso: 'O projeto Décima Arte participa de programas de afiliados (Amazon, Pichau, Terabyte, Mercado Livre, Shopee, etc). Isso significa que, se você comprar algo através de um dos links abaixo, o criador recebe uma pequena comissão — sem custo extra pra você. Não vendemos nem enviamos nenhum produto: só selecionamos o que achamos que vale a pena.'
promocoes_intro: Aqui você encontra hardware, periféricos, jogos, cupons de desconto e cadeiras em promoção.
apoie_intro: O projeto Décima Arte é feito de forma independente. Se o conteúdo te ajuda e te diverte, você pode apoiar com qualquer valor, via Pix/ QR Code.
sobre_texto: 'O Décima Arte nasceu de uma ideia simples: jogos são a décima arte, e merecem ser tratados com a mesma curiosidade e profundidade que qualquer outra forma de expressão. Aqui você encontra notícias quentes do mundo dos games, curiosidades sobre como os jogos são feitos — engines, ferramentas, bastidores de produção — e, aos poucos, guias e conteúdo em vídeo pra quem curte gameplays e pra quem sonha em trabalhar com desenvolvimento de games.'
footer_descricao: Notícias, curiosidades de desenvolvimento e  do mundo dos games.
footer_newsletter_texto: As notícias mais quentes, direto no seu e-mail. Você pode cancelar a inscrição da newsletter a qualquer momento.
