name: Marcar Marcas dos Produtos

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "relatorio = só mostra o que preencheria | aplicar = grava as marcas e salva"
        type: choice
        options:
          - relatorio
          - aplicar
        default: relatorio

permissions:
  contents: write
  pages: write

jobs:
  marcar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install pyyaml

      - name: Detectar marcas pelo título
        run: python .github/scripts/tag_brands.py ${{ inputs.modo }}

      - name: Salvar mudanças (só no modo aplicar)
        if: inputs.modo == 'aplicar'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _promocoes
          if git diff --cached --quiet; then
            echo "Nada pra salvar."
          else
            git commit -m "Preenche marcas dos produtos de Promoções pelo título"
            git push
            # Pede a publicação do site (garantia extra; se falhar, não derruba o job)
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          fi
