name: Supabase Keepalive

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar o banco pra manter o projeto ativo
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://lvkbrtyqjzvjimcfahej.supabase.co/rest/v1/comments?select=id&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx2a2JydHlxanp2amltY2ZhaGVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMTQyMzMsImV4cCI6MjEwNDc5MDIzM30.JegRq0USoUKfUgKDM95gKz69-o0SpTEjp-FTlfS93qs" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx2a2JydHlxanp2amltY2ZhaGVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMTQyMzMsImV4cCI6MjEwNDc5MDIzM30.JegRq0USoUKfUgKDM95gKz69-o0SpTEjp-FTlfS93qs")
          echo "HTTP status recebido: $STATUS"
          if [ "$STATUS" -ge 400 ]; then
            echo "Consulta falhou (status $STATUS) — pode ser projeto pausado ou chave expirada."
            exit 1
          fi
          echo "Supabase respondeu normalmente. Projeto continua ativo."
