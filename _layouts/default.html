<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} — {{ site.description }}{% endif %}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/apple-touch-icon.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/favicon-16x16.png' | relative_url }}">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
  <link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Rubik:wght@900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <script>
    // roda antes do resto pra evitar "flash" do tema errado
    if (localStorage.getItem('decima-theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>

  {% include header.html %}

  {{ content }}

  {% include footer.html %}

  <div id="cookie-banner" class="cookie-banner" style="display:none;">
    <p>Usamos cookies pra melhorar sua experiência e medir desempenho de conteúdo. <a href="{{ '/privacidade/' | relative_url }}">Saiba mais</a>.</p>
    <button onclick="aceitarCookies()">Entendi</button>
  </div>
  <script>
    if (!localStorage.getItem('decima-cookies-ok')) {
      document.getElementById('cookie-banner').style.display = 'flex';
    }
    function aceitarCookies() {
      localStorage.setItem('decima-cookies-ok', '1');
      document.getElementById('cookie-banner').style.display = 'none';
    }
  </script>

  <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
</body>
</html>
