---
layout: default
title: Apoie o projeto
---
<div class="simple-page">
  <h1>{{ page.title }}</h1>
  <p>{{ page.intro }}</p>

  <div class="contact-card" style="flex-direction:column;text-align:center;">
    {% if page.qr_image %}<img src="{{ page.qr_image | relative_url }}" alt="QR Code Pix" style="max-width:260px;margin-bottom:18px;">{% endif %}

    <div class="pix-key-box">
      <code id="pix-key" class="pix-key-text">{{ page.chave_pix }}</code>
      <button class="btn-copy-pix" onclick="copiarPix()">Copiar chave</button>
    </div>
  </div>

  {{ page.texto_final | markdownify }}
</div>

<script>
function copiarPix() {
  const key = document.getElementById('pix-key').innerText;
  navigator.clipboard.writeText(key).then(() => {
    const btn = document.querySelector('.btn-copy-pix');
    const original = btn.innerText;
    btn.innerText = 'Copiado! ✓';
    setTimeout(() => { btn.innerText = original; }, 2000);
  });
}
</script>
