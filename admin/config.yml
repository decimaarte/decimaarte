  - name: "textos"
    label: "Textos do site"
    files:
      - name: "textos_gerais"
        label: "Frases e avisos"
        file: "_data/textos.yml"
        fields:
          - { label: "Aviso de afiliado (página Promoções)", name: "promocoes_aviso", widget: "text" }
          - { label: "Texto de introdução (página Promoções)", name: "promocoes_intro", widget: "text" }
          - { label: "Texto de introdução (página Apoie)", name: "apoie_intro", widget: "text" }
          - { label: "Texto da página Sobre", name: "sobre_texto", widget: "text" }
          - { label: "Descrição curta (rodapé, abaixo da logo)", name: "footer_descricao", widget: "text" }
          - { label: "Texto da newsletter (rodapé)", name: "footer_newsletter_texto", widget: "text" }
          - { label: "Título do card de promoções (home)", name: "promo_card_titulo", widget: "string" }
          - { label: "Texto do card de promoções (home)", name: "promo_card_texto", widget: "text" }

  - name: "paginas"
    label: "Páginas fixas"
    label_singular: "Página"
    files:
      - name: "sobre"
        label: "Sobre"
        file: "sobre.html"
        fields:
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Texto", name: "body", widget: "markdown" }
      - name: "contato"
        label: "Contato"
        file: "contato.html"
        fields:
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Texto", name: "body", widget: "markdown" }
      - name: "apoie"
        label: "Apoie o projeto"
        file: "apoie.html"
        fields:
