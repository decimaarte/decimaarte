backend:
  name: github
  repo: decimaarte/decimaarte
  branch: main

# Login por token pessoal (PAT) — sem precisar de servidor de OAuth externo.
# Basta colar o token na tela de login do painel.

site_url: https://decimaarte.com.br
media_folder: "assets/img/uploads"
public_folder: "/assets/img/uploads"

# Nome do arquivo/endereço da matéria: sem acento e sem cedilha (ex.: "furacoes", e não "furações")
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: "posts"
    label: "Matérias"
    label_singular: "Matéria"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Data (horário de Brasília)", name: "date", widget: "datetime", input_timezone: "America/Sao_Paulo", hint: "Data e hora de Brasília. Se for no futuro, a matéria fica agendada e entra no ar sozinha (até ~15 min depois da hora)." }
      - label: "Categoria"
        name: "categories"
        widget: "select"
        multiple: false
        options:
          - { label: "Notícias", value: "noticias" }
          - { label: "Curiosidades Dev", value: "curiosidades-dev" }
          - { label: "Gameplays", value: "gameplays" }
        default: "curiosidades-dev"
      - label: "Tags (aparecem na faixa de categorias)"
        name: "tags"
        widget: "select"
        multiple: true
        required: false
        options:
          - { label: "Lançamentos", value: "lancamentos" }
          - { label: "PC", value: "pc" }
          - { label: "PlayStation", value: "playstation" }
          - { label: "Xbox", value: "xbox" }
          - { label: "Nintendo", value: "nintendo" }
          - { label: "Tech", value: "tech" }
          - { label: "Indie", value: "indie" }
          - { label: "Game Design", value: "game-design" }
          - { label: "Retro", value: "retro" }
          - { label: "Jogos grátis da semana", value: "jogos-gratis" }
          - { label: "Gift Cards", value: "gift-cards" }
      - { label: "Imagem de destaque", name: "image", widget: "image", required: false }
      - { label: "Crédito da imagem (opcional)", name: "image_credit", widget: "string", required: false, hint: "Só o nome da fonte, sem escrever 'Imagem:'. Ex.: Divulgação / Xbox Game Studios. Aparece em letra pequena embaixo da imagem na matéria." }
      - { label: "Resumo (aparece nos cards)", name: "excerpt", widget: "text", required: false }
      - { label: "Texto da matéria", name: "body", widget: "markdown" }
      - {label: "Autor", name: "author", widget: "string", required: false, default: "Deivisson Freitas"}
      - { label: "Destacar na home?", name: "destaque_home", widget: "boolean", required: false, default: false, hint: "Marque pra furar a ordem cronológica e aparecer em destaque na home (bloco de topo e nas seções de Notícias/Curiosidades)" }
      - { label: "Prioridade no destaque", name: "prioridade_home", widget: "number", required: false, hint: "Só importa se 'Destacar na home?' estiver marcado. Números menores aparecem primeiro (1 = topo de tudo). Deixe em branco se não quiser controlar a ordem entre os destaques." }

  - name: "promocoes"
    label: "Promoções"
    label_singular: "Promoção"
    folder: "_promocoes"
    create: true
    slug: "{{slug}}"
    view_groups:
      - label: "Categoria"
        field: categoria
    fields:
      - { label: "Nome do produto", name: "title", widget: "string" }
      - label: "Categoria"
        name: "categoria"
        widget: "select"
        options:
          - { label: "Placas de Vídeo", value: "placas-de-video" }
          - { label: "Processadores", value: "processadores" }
          - { label: "Placas-Mãe", value: "placas-mae" }
          - { label: "Memória RAM", value: "memoria-ram" }
          - { label: "Armazenamento (SSD, HD, pendrive, cartão de memória)", value: "armazenamento" }
          - { label: "Fontes", value: "fontes" }
          - { label: "Gabinetes", value: "gabinetes" }
          - { label: "Coolers", value: "coolers" }
          - { label: "Monitores", value: "monitores" }
          - { label: "TVs", value: "tvs" }
          - { label: "Teclados", value: "teclados" }
          - { label: "Mouses", value: "mouses" }
          - { label: "Headsets e Fones (inclui TWS)", value: "headsets" }
          - { label: "Microfones", value: "microfones" }
          - { label: "Caixas de Som (JBL, Alexa, soundbar...)", value: "caixas-de-som" }
          - { label: "Webcams", value: "webcams" }
          - { label: "Mousepads", value: "mousepads" }
          - { label: "Suportes de Monitor", value: "suportes-monitor" }
          - { label: "Cabos e Acessórios", value: "cabos-acessorios" }
          - { label: "Controles", value: "controles" }
          - { label: "Cadeiras", value: "cadeiras-mesas" }
          - { label: "Mesas e Escrivaninhas", value: "mesas-escrivaninhas" }
          - { label: "Mesas Digitalizadoras", value: "mesas-digitalizadoras" }
          - { label: "Notebooks", value: "notebooks" }
          - { label: "Celulares", value: "celulares" }
          - { label: "Consoles", value: "consoles" }
          - { label: "Acessórios de Console", value: "acessorios-console" }
          - { label: "Kits Completos", value: "kits" }
          - { label: "Jogos & Keys", value: "jogos-keys" }
          - { label: "Gift Cards", value: "gift-cards" }
          - { label: "Pra quem tá começando", value: "pra-quem-ta-comecando" }
      - label: "Marcas (pode marcar várias: fabricante, chip...)"
        name: "marcas"
        widget: "select"
        multiple: true
        required: false
        hint: "Ex.: placa-mãe ASRock com Ryzen = ASRock + AMD. Marca que não está na lista? Me avise que eu adiciono."
